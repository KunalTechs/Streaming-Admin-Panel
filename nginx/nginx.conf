worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Define Proxy Cache Path in SSD/Memory
    proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:100m max_size=10g inactive=24h use_temp_path=off;

    # NGINX Edge Layer Rate Limiting Zone for HLS Media Chunks (30 reqs/s with 50 burst)
    limit_req_zone $binary_remote_addr zone=hls_chunk_limit:10m rate=30r/s;

    server {
        listen 80;

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Cache .m3u8 Playlists for 5 seconds (updates dynamically as encoding finishes)
        location ~* \.m3u8$ {
            proxy_pass http://minio:9000;
            proxy_cache hls_cache;
            proxy_cache_valid 200 5s;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Cache .ts Media Chunks for 1 Year (Immutable media data + Secure Link Token Validation + Rate Burst)
        location ~* \.ts$ {
            # Edge Burst Rate Limit (allow bursts up to 50 segments without delay)
            limit_req zone=hls_chunk_limit burst=50 nodelay;

            # Secure Link Token Validation (prevents hotlinking/scraping)
            secure_link $arg_st,$arg_expires;
            secure_link_md5 "$arg_expires$uri secret_signing_key";

            if ($secure_link = "") {
                return 403; # Forbidden: invalid token
            }
            if ($secure_link = "0") {
                return 410; # Gone: token expired
            }

            proxy_pass http://minio:9000;
            proxy_cache hls_cache;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            proxy_cache_use_stale error timeout updating;
        }

        location / {
            proxy_pass http://minio:9000;
        }
    }
}

